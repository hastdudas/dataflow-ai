name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: lint / typecheck / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache: npm` yet: caching requires a lockfile, and this repo
          # has none until someone runs `npm install` locally and commits
          # package-lock.json. Once that lands, add `cache: npm` back.

      - name: Install dependencies
        # `npm ci` needs a lockfile; fall back until one is committed.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Dummy values: every secret is read at request time, not build time,
        # so the build must succeed without real credentials.
        env:
          NEXT_PUBLIC_SITE_URL: https://shuketter.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
        run: npm run build
